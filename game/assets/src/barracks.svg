<svg id="art" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bkWallFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8dcc0"/>
      <stop offset="100%" stop-color="#c2af86"/>
    </linearGradient>
    <linearGradient id="bkRoofFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c7a9c"/>
      <stop offset="100%" stop-color="#39516d"/>
    </linearGradient>
    <radialGradient id="bkGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="360" rx="140" ry="18" fill="#000000" opacity="0.18"/>

  <!-- faint gold glow, modest — a humble tier-1 building, not as radiant as Church/Angel -->
  <circle cx="200" cy="220" r="120" fill="url(#bkGlow)"/>

  <!-- dirt mound -->
  <path d="M56,352 Q50,320 92,315 Q84,300 122,294 Q142,272 200,276 Q258,270 278,294 Q316,298 308,318 Q350,322 344,352 Z"
        fill="#7a4a26" stroke="#2b1d12" stroke-width="7" stroke-linejoin="round"/>
  <path d="M74,336 Q120,326 164,334" fill="none" stroke="#5c3719" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M236,338 Q280,328 316,336" fill="none" stroke="#5c3719" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- simple rectangular wooden/stone barrack hall -->
  <path d="M84,300 L84,190 L316,190 L316,300 Q316,308 308,308 L92,308 Q84,308 84,300 Z"
        fill="url(#bkWallFill)" stroke="#2b1d12" stroke-width="8" stroke-linejoin="round"/>
  <!-- wall shading -->
  <path d="M256,190 L316,190 L316,300 Q316,308 308,308 L268,308 Q286,250 256,190 Z" fill="#9c876a" opacity="0.5"/>
  <path d="M84,190 L124,190 Q104,250 96,306 L92,308 Q84,308 84,300 Z" fill="#f4ead2" opacity="0.5"/>

  <!-- simple pitched roof, plain and low (humbler than Church's gable) -->
  <path d="M64,196 Q62,186 76,182 L200,132 L324,182 Q338,186 336,196 Q300,208 200,210 Q100,208 64,196 Z"
        fill="url(#bkRoofFill)" stroke="#2b1d12" stroke-width="8" stroke-linejoin="round"/>
  <path d="M200,132 L296,178 Q312,183 318,192 Q280,204 214,208 Q252,168 200,132 Z" fill="#2a3c50" opacity="0.45"/>
  <path d="M200,132 L104,178 Q88,183 82,192 Q100,198 122,202 Q160,164 200,132 Z" fill="#8ba0ba" opacity="0.4"/>
  <path d="M76,182 Q140,196 200,197 Q260,196 324,182" fill="none" stroke="#2b1d12" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- door -->
  <path d="M172,308 L172,240 Q172,224 200,224 Q228,224 228,240 L228,308 Z"
        fill="#5c3719" stroke="#2b1d12" stroke-width="7" stroke-linejoin="round"/>
  <path d="M180,300 L180,242 Q180,232 200,232 L200,300 Z" fill="#7a4a26" opacity="0.6"/>

  <!-- two plain shuttered windows flanking the door -->
  <rect x="106" y="230" width="42" height="46" rx="6" fill="#39516d" stroke="#2b1d12" stroke-width="6"/>
  <rect x="252" y="230" width="42" height="46" rx="6" fill="#39516d" stroke="#2b1d12" stroke-width="6"/>
  <path d="M110,234 L144,234 M110,272 L144,272 M256,234 L290,234 M256,272 L290,272"
        stroke="#26374a" stroke-width="4" opacity="0.6"/>

  <!-- small banner pole with a plain Loi-blue pennant, simpler than Angel/Church's halo -->
  <line x1="200" y1="132" x2="200" y2="76" stroke="#2b1d12" stroke-width="7" stroke-linecap="round"/>
  <path d="M200,80 L246,96 L200,112 Z" fill="#3a5a8c" stroke="#2b1d12" stroke-width="6" stroke-linejoin="round"/>
  <path d="M200,84 L232,96 L200,108 Z" fill="#5c7ab0" opacity="0.7"/>

  <!-- crossed practice spears leaning against the wall — barracks flavor -->
  <path d="M100,306 L138,214" stroke="#8a6a42" stroke-width="9" stroke-linecap="round"/>
  <path d="M140,306 L102,214" stroke="#8a6a42" stroke-width="9" stroke-linecap="round"/>
  <path d="M138,214 L128,196 L148,204 Z" fill="#9caec4" stroke="#2b1d12" stroke-width="4" stroke-linejoin="round"/>
  <path d="M102,214 L92,204 L112,196 Z" fill="#9caec4" stroke="#2b1d12" stroke-width="4" stroke-linejoin="round"/>
</svg>
