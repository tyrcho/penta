<svg id="art" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sfFieldGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#e0fbff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#7ee8f5" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sfCrystalFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bdf3fb"/>
      <stop offset="55%" stop-color="#5fd4e8"/>
      <stop offset="100%" stop-color="#2a90a8"/>
    </linearGradient>
    <linearGradient id="sfMetalFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4e8ea"/>
      <stop offset="50%" stop-color="#b9c2c6"/>
      <stop offset="100%" stop-color="#828e93"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="366" rx="130" ry="18" fill="#000000" opacity="0.18"/>

  <!-- wide field-glow bleeding outward -->
  <circle cx="200" cy="222" r="175" fill="url(#sfFieldGlow)"/>

  <!-- energy field ring (translucent, drawn behind the pylon, big ellipse to read as a dome) -->
  <ellipse cx="200" cy="240" rx="160" ry="118" fill="none" stroke="#7ee8f5" stroke-width="10" opacity="0.55"/>
  <ellipse cx="200" cy="240" rx="160" ry="118" fill="none" stroke="#e0fbff" stroke-width="4" opacity="0.7"/>
  <!-- small electric-arc ticks around the ring -->
  <path d="M60,230 L48,220 L58,212" fill="none" stroke="#e0fbff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M340,232 L352,222 L342,214" fill="none" stroke="#e0fbff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M200,124 L192,110 L208,104" fill="none" stroke="#e0fbff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- base plinth -->
  <path d="M120,320 L280,320 Q292,320 292,332 L292,350 Q292,360 280,360 L120,360 Q108,360 108,350 L108,332 Q108,320 120,320 Z"
        fill="url(#sfMetalFill)" stroke="#1c3a3d" stroke-width="8" stroke-linejoin="round"/>
  <path d="M118,340 L282,340 L282,352 Q282,356 278,356 L122,356 Q118,356 118,352 Z" fill="#5c7377" opacity="0.5"/>
  <path d="M116,324 L284,324 L284,332 L116,332 Z" fill="#f2f6f7" opacity="0.5"/>

  <!-- twin support struts rising from the plinth -->
  <path d="M148,320 L136,196 Q136,186 146,186 L162,186 Q172,186 170,196 L166,320 Z"
        fill="url(#sfMetalFill)" stroke="#1c3a3d" stroke-width="7" stroke-linejoin="round"/>
  <path d="M252,320 L264,196 Q264,186 254,186 L238,186 Q228,186 230,196 L234,320 Z"
        fill="url(#sfMetalFill)" stroke="#1c3a3d" stroke-width="7" stroke-linejoin="round"/>
  <path d="M150,300 L142,196 L154,196 L158,300 Z" fill="#eef7f8" opacity="0.45"/>

  <!-- central crystal emitter, faceted, floating above the plinth -->
  <path d="M200,120 L240,176 L224,246 L176,246 L160,176 Z"
        fill="url(#sfCrystalFill)" stroke="#123338" stroke-width="8" stroke-linejoin="round"/>
  <path d="M200,120 L240,176 L224,246 L200,246 L200,120 Z" fill="#1f7d92" opacity="0.35"/>
  <path d="M200,120 L166,178 L176,246 L200,246 Z" fill="#d8fbff" opacity="0.45"/>
  <path d="M200,120 L240,176 L200,190 Z" fill="#eafeff" opacity="0.6"/>

  <!-- small orbiting energy motes -->
  <circle cx="130" cy="230" r="8" fill="#e0fbff" opacity="0.9"/>
  <circle cx="272" cy="240" r="7" fill="#7ee8f5" opacity="0.85"/>
  <circle cx="200" cy="290" r="6" fill="#bdf3fb" opacity="0.8"/>
</svg>
